<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ब्लॉग | शेतकरी सेवार्थ</title>
<meta name="description" content="शेतकरी सेवार्थ - योजना व शेतीविषयक माहिती">
<link rel="canonical" href="https://shetkarisevarth.in/blog/">
<meta property="og:title" content="ब्लॉग">
<meta property="og:description" content="शेतकरी सेवार्थ - योजना व शेतीविषयक माहिती">
<meta property="og:url" content="https://shetkarisevarth.in/blog/">
<meta property="og:type" content="article">
{{og_image_tag}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:#1f2937;font-size:17px;line-height:1.9;
    font-family:'Tiro Devanagari Marathi','Noto Sans Devanagari',sans-serif;
    background:radial-gradient(ellipse at top,#ecfdf5 0%,#f8fafc 48%,#f1f5f9 100%)}
  header{background:linear-gradient(135deg,#065f46 0%,#047857 50%,#0f766e 100%);color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);text-align:center;padding:20px 16px}
  header a{color:#fff;text-decoration:none;font-size:30px;font-weight:800;letter-spacing:-.02em}
  main{flex:1;width:100%;max-width:860px;margin:22px auto;padding:0 16px}
  a{color:#047857}
  .back{display:inline-block;margin:0 0 12px;font-weight:700;text-decoration:none}

  /* hero */
  .hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;min-height:240px;display:flex;align-items:flex-end;
    background:linear-gradient(135deg,#065f46 0%,#047857 55%,#0f766e 100%);background-size:cover;background-position:center;
    box-shadow:0 18px 40px rgba(6,78,59,.25)}
  .hero-in{padding:28px 26px;width:100%}
  .hero .emoji{display:block;font-size:54px;line-height:1;margin-bottom:10px}
  .hero h1{margin:0;font-size:32px;line-height:1.4;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.35)}
  .hero .meta{margin:10px 0 0;font-size:14px;opacity:.92}
  .tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:2px 12px;font-size:13px;margin-bottom:10px}

  /* article */
  article{background:#fff;border:1px solid #d7e8dc;border-radius:20px;padding:26px 24px;margin-top:18px;box-shadow:0 12px 30px rgba(15,80,45,.08)}
  article h2{font-size:23px;color:#064e3b;margin:30px 0 8px;padding-left:12px;border-left:5px solid #10b981;line-height:1.5}
  article h3{font-size:19px;color:#065f46;margin:22px 0 4px}
  article p{margin:10px 0}
  article ul,article ol{padding-left:22px}
  article li{margin:4px 0}
  article img{max-width:100%;height:auto;border-radius:12px;margin:10px 0}
  blockquote{margin:18px 0;padding:12px 16px;border-left:4px solid #f59e0b;background:#fffbeb;border-radius:0 10px 10px 0;font-size:15px}
  hr{border:0;border-top:1px solid #d7e8dc;margin:24px 0}

  /* share + cta */
  .share{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:10px 18px;font:700 15px 'Noto Sans Devanagari',sans-serif;text-decoration:none;cursor:pointer}
  .btn.wa{background:#25d366;color:#fff}
  .btn.copy{background:#fff;color:#065f46;border:1px solid #a7f3d0}
  .cta{margin:22px 0;padding:22px;border-radius:20px;text-align:center;color:#fff;background:linear-gradient(135deg,#065f46,#047857 55%,#0f766e);box-shadow:0 12px 30px rgba(6,78,59,.25)}
  .cta p{margin:0 0 12px;font-size:18px;font-weight:700}
  .cta a{display:inline-block;background:#fff;color:#065f46;font:800 16px 'Noto Sans Devanagari',sans-serif;padding:12px 26px;border-radius:99px;text-decoration:none}

  /* cards (blog list + related) */
  .sec-title{font-size:22px;color:#064e3b;margin:26px 0 12px;font-weight:800}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;background:#fff;border:1px solid #d7e8dc;border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:all .3s ease}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 28px -8px rgba(0,0,0,.18);border-color:#047857}
  .thumb{height:150px;background:linear-gradient(135deg,#d1fae5,#a7f3d0);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:48px}
  .cbody{padding:14px 16px 16px}
  .cbody .d{color:#6b7280;font-size:13px}
  .cbody h2{margin:4px 0 6px;font-size:18px;line-height:1.5;color:#064e3b}
  .cbody p{margin:0;font-size:14px;color:#4b5563;line-height:1.7}
  .listhead h1{font-size:30px;color:#064e3b;margin:6px 0 2px}
  .listhead p{margin:0 0 16px;color:#4b5563}

  .sv-site-footer{background:#0f172a;color:#cbd5e1;text-align:center;padding:24px 16px;margin-top:40px;font-size:13px;line-height:1.8}
  .sv-footer-note{color:#f1f5f9;font-size:14px;margin:0 0 6px}
  .sv-footer-email{margin:4px 0}
  .sv-footer-email a{color:#6ee7b7;text-decoration:underline;text-underline-offset:3px;font-weight:700;overflow-wrap:anywhere}
  .sv-footer-copy{color:#94a3b8;margin:8px 0 0}
  @media(max-width:640px){header a{font-size:24px}.hero{min-height:200px}.hero h1{font-size:24px}article{padding:20px 16px}}
</style>
</head>
<body>
<header><a href="/">शेतकरी सेवार्थ</a></header>
<main>
  <a class="back" href="/#blog">← सर्व लेख</a>
  {{body}}
</main>
<footer class="sv-site-footer" role="contentinfo"><p class="sv-footer-note">सदर माहिती आपल्या उपयुक्त वाटल्यास किंवा सूचना असल्यास संपर्क साधू शकता.</p><p class="sv-footer-email">📧 ई-मेल: <a href="mailto:shetkarisevarthofficial@gmail.com">shetkarisevarthofficial@gmail.com</a></p><p class="sv-footer-copy">© २०२६ शेतकरी सेवार्थ | सर्व हक्क सुरक्षित</p></footer>
</body>
</html>
